---
# Ansible Playbook: Create Logical Volume on VIOS and map to LPAR
#
# Führt die Rolle create_lpar_lv aus. Nur eine Verbindung (zur HMC);
# VIOS-Befehle laufen per viosvrcmd auf der HMC.
#
# Play 0 wählt die erste erreichbare HMC (SSH-Port 22). Play 1 führt die Rolle
# nur auf diesem Host aus – auch wenn die Inventory-Gruppe hmc zwei HMCs enthält.
# Override: -e hmc_host=... oder -e create_lpar_lv_hmc_host=... überspringt die Prüfung.
# Play 2 führt rescan-scsi-bus.sh auf der Ziel-LPAR aus (Inventory-Host =
# create_lpar_lv_lpar_name), damit die neue vSCSI-Platte im Gast erscheint.
#
# Pflichtparameter (-e oder in group_vars):
#   create_lpar_lv_lpar_name        - Name der LPAR
#   create_lpar_lv_managed_system   - Managed System (z.B. power91)
#   create_lpar_lv_volume_name      - Name des Logical Volume
#   create_lpar_lv_volume_group     - Volume Group auf der VIOS
#   create_lpar_lv_vios_name        - VIOS-Partition (z.B. power91-vios)
#   create_lpar_lv_hmc_password    - HMC-Passwort
#
# Optional u.a.:
#   create_lpar_lv_hmc_host / hmc_host  - HMC-Host (sonst erste erreichbare aus Gruppe hmc)
#   create_lpar_lv_disk_size_gb         - Größe in GB (Default: 50)
#
# Beispiel:
#   ansible-playbook lpar_add_lv.yml -i inventory/hosts.yml \
#     -e "create_lpar_lv_lpar_name=mylpar" \
#     -e "create_lpar_lv_managed_system=power91" \
#     -e "create_lpar_lv_volume_name=mylpar_runix" \
#     -e "create_lpar_lv_volume_group=datavg" \
#     -e "create_lpar_lv_vios_name=power91-vios" \
#     -e "create_lpar_lv_disk_size_gb=100" \
#     -e "hmc_pass=YOUR_HMC_PASS" \
#     -e "create_lpar_lv_hmc_password={{ hmc_pass }}"

# =============================================================================
# PLAY 0: Erste erreichbare HMC ermitteln
# =============================================================================

- name: Find first reachable HMC host
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _hmc_host_override: "{{ create_lpar_lv_hmc_host | default(hmc_host | default(''), true) }}"

  tasks:
    - name: Use explicitly set HMC host
      ansible.builtin.set_fact:
        hmc_host: "{{ _hmc_host_override }}"
      when: _hmc_host_override | length > 0

    - name: Check reachability of each HMC host (SSH port 22)
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host | default(item) }}"
        port: 22
        timeout: 3
      loop: "{{ groups['hmc'] }}"
      register: hmc_reach_result
      ignore_errors: true
      loop_control:
        label: "{{ item }}"
      when: hmc_host | default('') | length == 0

    - name: Set first reachable HMC host
      ansible.builtin.set_fact:
        hmc_host: "{{ (hmc_reach_result.results | rejectattr('failed') | map(attribute='item') | first) | default('') }}"
      when: hmc_host | default('') | length == 0

    - name: Fail if no HMC host is reachable
      ansible.builtin.fail:
        msg: "No HMC host could be reached. Checked: {{ groups['hmc'] | join(', ') }}."
      when: hmc_host | length == 0

    - name: Show selected HMC host
      ansible.builtin.debug:
        msg: "Using HMC host: {{ hmc_host }}"

# =============================================================================
# PLAY 1: Rolle nur auf der ausgewählten HMC
# =============================================================================

- name: Create LPAR Logical Volume on VIOS (eine HMC)
  hosts: "{{ hostvars['localhost'].hmc_host }}"
  gather_facts: false

  environment:
    REQUESTS_CA_BUNDLE: ""
    CURL_CA_BUNDLE: ""

  vars:
    # set defaults
    create_lpar_lv_hmc_password: "{{ hmc_password | default('') }}"
    create_lpar_lv_hmc_username: "{{ hmc_username | default('') }}"
    create_lpar_lv_hmc_host: "{{ inventory_hostname }}"
    create_lpar_lv_volume_name: "{{ create_lpar_lv_volume_name }}-extradisk"
    create_lpar_lv_vios_name: "{{ create_lpar_lv_managed_system }}-vios"

  roles:
    - role: create_lpar_lv
      # Alle create_lpar_lv_* Variablen via -e oder group_vars/host_vars setzen

# =============================================================================
# PLAY 2: SCSI-Rescan auf der Ziel-LPAR (Gast)
# =============================================================================

- name: Rescan SCSI bus on target LPAR
  hosts: "{{ create_lpar_lv_lpar_name }}"
  gather_facts: false
  become: true

  tasks:
    - name: Wait for VIOS mapping to settle
      ansible.builtin.pause:
        seconds: 5

    - name: Rescan SCSI bus for new vSCSI disk
      ansible.builtin.command: rescan-scsi-bus.sh -a
      register: lpar_scsi_rescan
      changed_when: true

    - name: Show block devices after rescan
      ansible.builtin.command: lsblk -d -o NAME,SIZE,TYPE,MODEL
      register: lpar_lsblk
      changed_when: false

    - name: Display lsblk
      ansible.builtin.debug:
        var: lpar_lsblk.stdout_lines
